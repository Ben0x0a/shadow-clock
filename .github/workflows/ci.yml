# ci.yml — verification on every push and pull request (static-web-app skill template,
# plus ShadowClock's browser tests).
#
# Defines : one job: install from the lockfile, type-check and unit-test, prove
#           public/ is exactly what src/ builds to, then run the verification
#           gate (CSP, consent, accessibility, mobile, single file, offline) in
#           Google Chrome, then ShadowClock's browser tests (examples, sharing,
#           map consent, reflow, the offline single file).
# Uses    : mise.toml (Node.js), package-lock.json (platform, TypeScript,
#           esbuild, Playwright), the `swp` command of static-web-platform,
#           scenarios.json, e2e/.
#
# The platform is a PRIVATE Git submodule in platform/ (package.json:
# "file:platform"). The app is checked out with the job's own token; the
# submodule is then fetched with a read-only deploy key of the platform
# repository, stored in this repository as the secret PLATFORM_DEPLOY_KEY.
# (A deploy key opens only the platform, read-only, and does not expire.)
# If the platform repository is public, drop that step and set submodules: true.
#
# WHY actions are pinned to commit SHAs (version in the comment): a tag can be
# moved to other code; a SHA cannot. Dependabot proposes updates.
# Deployment is NOT done here: the host publishes public/ as committed.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false                 # private submodule: fetched in the next step

      # HOW: GitHub's SSH host keys come from its API over HTTPS (TLS proves
      # their origin, unlike ssh-keyscan). ShadowClock's .gitmodules already uses
      # the SSH address; the insteadOf rewrite only matters for an HTTPS address.
      - name: Fetch the private platform submodule (read-only deploy key)
        env:
          PLATFORM_DEPLOY_KEY: ${{ secrets.PLATFORM_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PLATFORM_DEPLOY_KEY" > ~/.ssh/platform
          chmod 600 ~/.ssh/platform
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          git -c url."git@github.com:".insteadOf="https://github.com/" \
              -c core.sshCommand="ssh -i ~/.ssh/platform -o IdentitiesOnly=yes" \
              submodule update --init --depth 1
          rm -f ~/.ssh/platform

      # Installs the Node.js version pinned in mise.toml (same as on the developer machine).
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"

      - name: Install from the lockfile (platform, TypeScript, esbuild)
        run: npm ci

      - name: Type check and unit tests
        run: npm run typecheck && npm test

      - name: public/ is up to date with src/
        run: npx swp check

      - name: public/ is byte-for-byte what src/ builds to
        run: npx swp verify

      - name: Google Chrome available for the gate
        run: command -v google-chrome || uvx --from playwright==1.63.0 playwright install --with-deps chrome

      - name: Verification gate
        run: npx swp gate

      - name: Browser tests (examples, sharing, map consent, reflow, offline single file)
        run: npx playwright test

      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
