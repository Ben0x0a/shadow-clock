<!DOCTYPE html>
<!--
  index.html — page shell of ShadowClock. Not served as is: the platform build
  (npx swp build) turns it into public/index.html (site) and the single-file download.

  Defines : the static landmarks and slots. BUILD:HEAD receives the CSP, title, icons
            and styles; BUILD:BODY the config and the app bundle.
  Used by : swp build.
  Uses    : the platform fills #app-actions (install / download / updates / privacy /
            accessibility / status) and adds its dialogs; main.ts fills every slot
            through the features and puts the support link in #app-footer.
-->

/*
  ui/base.css — the platform's shared styles (static-web-platform).
  Apps put their styles in their own CSS, loaded after this file, so they can
  override the tokens below.

  Defines : colour tokens (light + dark, WCAG AA contrast), focus ring,
            visually-hidden utility, skip link, buttons, status line, dialogs
            (consent, privacy, install), phone rules every app gets (44px
            targets, 16px form fields), reduced-motion.
  Used by : the platform build (swp): <link> on the site, inlined in the
            single file — always before the app's CSS.
  Uses    : nothing.
*/
:root {
  --bg: #f4f6f8; --surface: #ffffff; --text: #1b1f24; --muted: #555e68;
  --border: #c4ccd4; --control-border: #79838d; --hover: #e8eef4;
  --accent: #0b5cad; --on-accent: #ffffff; --focus: #0b5cad; --notice: #7a4b00;
}
/* Dark tokens: from the OS setting unless the user chose a theme
   (<html data-theme="light|dark">, Accessibility dialog). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191d; --surface: #1f2328; --text: #e8ecf0; --muted: #a9b3bd;
    --border: #3a424b; --control-border: #6f7a85; --hover: #2a3037;
    --accent: #7cc4fa; --on-accent: #0b1a26; --focus: #7cc4fa; --notice: #f2c46d;
  }
}
:root[data-theme="dark"] {
  --bg: #16191d; --surface: #1f2328; --text: #e8ecf0; --muted: #a9b3bd;
  --border: #3a424b; --control-border: #6f7a85; --hover: #2a3037;
  --accent: #7cc4fa; --on-accent: #0b1a26; --focus: #7cc4fa; --notice: #f2c46d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px;
                   overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 8px; top: -100px; z-index: 2147483647;   /* above any sticky header */ padding: 12px 14px; min-height: 44px;
             background: var(--accent); color: var(--on-accent); border-radius: 6px; }
.skip-link:focus { top: 8px; }

/* ---- Buttons and header actions ---- */
button, .button {
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
  border: 1px solid var(--control-border); border-radius: 6px; padding: 6px 12px;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
button:hover, .button:hover { background: var(--hover); }
button:disabled { opacity: 0.6; cursor: default; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#app-actions { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#status { font-size: 14px; color: var(--muted); }
#status.notice { color: var(--notice); font-weight: 600; }

/* ---- "Support the author" link (placed by the app) ---- */
.swp-support { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px;
               color: var(--accent); font-weight: 600; text-decoration: none; }
.swp-support-text { text-decoration: underline; text-underline-offset: 3px; }   /* text only, not the cup */

/* ---- Dialogs ---- */
dialog { max-width: min(560px, calc(100vw - 32px)); color: var(--text); background: var(--surface);
         border: 1px solid var(--control-border); border-radius: 10px; padding: 20px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
dialog h2 { margin-top: 0; font-size: 18px; }
dialog dt { font-weight: 600; }
dialog dd { margin: 0 0 8px; word-break: break-all; }
.consent-value { display: block; margin-top: 4px; padding: 6px 8px; border-radius: 4px;
                 background: var(--hover); white-space: pre-wrap; word-break: break-all; }
dialog li { margin-bottom: 6px; }
.share-items dd { margin: 0 0 8px; word-break: break-word; }
#share-link { width: 100%; padding: 6px 8px; font: inherit; }
dialog fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 12px 0; }
dialog .choice { display: flex; align-items: center; gap: 8px; min-height: 32px; }
dialog .choice input { width: 24px; height: 24px; margin: 0; flex: none; }
dialog .hint { color: var(--muted); font-size: 13px; }
.dialog-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.origin-list { list-style: none; padding: 0; }
.origin-group { display: block !important; }
.origin-group summary { cursor: pointer; padding: 10px 0; min-height: 44px; }
.origin-list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
                  padding: 8px 0; border-bottom: 1px solid var(--border); }

/* ---- Phones (every app): ≥ 44px tap targets; form fields ≥ 16px, because
   iOS Safari zooms the whole page when focusing a field with smaller text. ---- */
@media (max-width: 640px) {
  button, .button { min-height: 44px; }
  input, select, textarea { font-size: max(16px, 1em); }
  input:not([type=checkbox]):not([type=radio]), select { min-height: 44px; }
  dialog .choice { min-height: 44px; }
  dialog .choice label { flex: 1; min-height: 44px; display: flex; align-items: center; }   /* the label row is the target */
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* src/ui/controls.css */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-weight: 500;
  text-decoration: none;
  color: var(--text-primary);
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) {
  background: var(--surface-2);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn.ghost {
  border-color: transparent;
  background: transparent;
}
.btn.ghost:hover:not(:disabled) {
  background: var(--accent-wash);
}
.btn.small {
  min-height: 30px;
  padding: 4px 10px;
  font-size: 13px;
}
.btn.icon-only {
  width: 38px;
  padding: 0;
}
.btn.danger {
  color: var(--bad);
}
input[type=time]:focus,
input[type=date]:focus,
input[type=time]:focus-within,
input[type=date]:focus-within {
  outline: 2px solid var(--accent);

}
.link {
  border: 0;

  padding: 0;
  min-height: 24px;
  display: inline-flex;
  align-items: center;

  text-decoration: underline;

  font-size: 13px;
}

}
.menu > summary {

}

  z-index: 30;
  min-width: 260px;

  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
  display: flex;
  flex-direction: column;
}
.menu-list.right {
  left: auto;
  right: 0;
}
.menu-list button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  border: 0;
  background: none;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.menu-list button:hover,
.menu-list button:focus-visible {
  background: var(--accent-wash);
}
.menu-list small {
  color: var(--text-secondary);
  font-size: 12px;
}
.menu-list small.warn-text {
  color: var(--warn);
}
.menu-list hr {
  width: 100%;
  border: 0;
  border-top: 1px solid var(--border);
  margin: 4px 0;
}
#examples-list {
  width: min(360px, calc(100vw - 32px));
}
.menu-list {
  max-width: calc(100vw - 32px);
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  padding: 3px;
  gap: 2px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  width: fit-content;
  max-width: 100%;
}
.seg-item {
  position: relative;
}
.seg input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  z-index: 1;
  cursor: pointer;
}
.seg label {
  display: block;
  padding: 5px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
  user-select: none;
}
.seg input:checked + label {
  background: var(--surface);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 0 0 1px var(--border);
}
.seg input:focus-visible + label {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.seg.small label {
  padding: 3px 10px;
  font-size: 13px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel > h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
}
.panel.optional > h2::after {
  content: "optional";
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 1px 8px;
}
.step {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent-wash);
  color: var(--accent-strong);
  font-size: 13px;
  font-weight: 700;
}
.panel.advanced {
  gap: 0;
}
.panel.advanced > summary,
details.card > summary {
  cursor: pointer;
  list-style: none;
}
.panel.advanced > summary h2 {
  font-size: 15px;
  display: inline;
  color: var(--text-secondary);
}
.panel.advanced[open] > summary {
  margin-bottom: 12px;
}
.panel.advanced > summary::-webkit-details-marker,
details.card > summary::-webkit-details-marker {
  display: none;
}
.panel.advanced > summary::before,
details.card > summary::before,
details.cluster > summary::before,
details.year > summary::before,
details.notes > summary::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 10px;
  border-right: 2px solid var(--text-muted);
  border-bottom: 2px solid var(--text-muted);
  transform: rotate(-45deg);
  transition: transform 0.15s;
  vertical-align: 2px;
  flex: none;
}
.panel.advanced[open] > summary::before,
details.card[open] > summary::before,
details.cluster[open] > summary::before,
details.year[open] > summary::before,
details.notes[open] > summary::before {
  transform: rotate(45deg);
}
.section-intro {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.card.result {
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card.result > summary {
  display: flex;
  align-items: center;
}
.card.result > summary h3 {
  display: inline;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-head h3,
.card.result h3 {
  font-size: 15px;
}
.card-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.row > .field {
  flex: 1 1 120px;
  min-width: 0;
}
.row > .field.wide {
  flex: 3 1 220px;
}
.grow {
  flex: 1 1 160px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.field label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}
.input-wrap {
  position: relative;
  display: flex;
}
.field input,
.field select,
.input-wrap input {
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--chart-surface);
  font-variant-numeric: tabular-nums;
}
.field select {
  padding-right: 28px;
}
.input-wrap .suffix {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}
.input-wrap:has(.suffix) input {
  padding-right: 34px;
}
.input-wrap.joined input {
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}
.input-wrap.joined select {
  width: auto;
  min-height: 38px;
  border: 1px solid var(--border-strong);
  border-left: 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--surface-2);
  padding: 0 8px;
}
input[aria-invalid=true] {
  border-color: var(--bad) !important;
  box-shadow: 0 0 0 3px var(--bad-wash);
}
input:focus,
select:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-wash);
}
.hint {
  color: var(--text-muted);
  font-size: 12.5px;

.hint.ok {

.note {

  align-items: center;
  gap: 8px;

  border-radius: var(--radius-sm);
  padding: 8px 10px;
}
fieldset.group {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 0;
  padding: 12px 0 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
fieldset.group legend {
  font-weight: 600;
  font-size: 14px;
  padding: 0 8px 0 0;
}
.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 36px;
  padding: 4px 6px 4px 0;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  font-size: 14px;
  text-align: left;
  white-space: normal;
}
.switch:hover {
  background: none;
}
.switch-track {
  width: 36px;
  height: 20px;
  border-radius: 99px;
  background: var(--axis);
  position: relative;
  transition: background 0.15s;
  flex: none;
}
.switch-track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}
.switch[aria-checked=true] .switch-track {
  background: var(--accent);

.switch[aria-checked=true] .switch-track::after {

  position: relative;

.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

}
.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

}
.leaflet-div-icon {
  background: #fff;

}
.leaflet-tooltip {

  -moz-user-select: none;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

  background: transparent;

}
.leaflet-tooltip-bottom {
  margin-top: 6px;
}
.leaflet-tooltip-top {
  margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
  left: 50%;
  margin-left: -6px;
}
.leaflet-tooltip-top:before {
  bottom: 0;
  margin-bottom: -12px;
  border-top-color: #fff;
}
.leaflet-tooltip-bottom:before {
  top: 0;
  margin-top: -12px;
  margin-left: -6px;
  border-bottom-color: #fff;
}
.leaflet-tooltip-left {
  margin-left: -6px;
}
.leaflet-tooltip-right {
  margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
  top: 50%;
  margin-top: -6px;
}
.leaflet-tooltip-left:before {
  right: 0;
  margin-right: -12px;
  border-left-color: #fff;
}
.leaflet-tooltip-right:before {
  left: 0;
  margin-left: -12px;
  border-right-color: #fff;
}
@media print {
  .leaflet-control {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* src/features/inputs/inputs.css */
.shots {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shot {
  border-left: 4px solid var(--shot-color);
}
.shot-1 {
  --shot-color: var(--shot-1);
}
.shot-2 {
  --shot-color: var(--shot-2);
}
.shot-3 {
  --shot-color: var(--shot-3);
}
.shot-4 {
  --shot-color: var(--shot-4);
}
.shot > summary {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 12px 14px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--shot-color);
  flex: none;
}
.shot-title {
  font-weight: 600;
}
.badge {
  font-size: 12px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 0 8px;
}
.preview {
  flex-basis: 100%;
  padding-left: 35px;
  font-size: 13px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.preview.bad {
  color: var(--text-muted);
}
.card-body {
  padding: 0 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.elev-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.diagram {
  width: 84px;
  flex: none;
}
.elev-head > .stack {
  min-width: 0;
}
.elev-head .seg {
  flex-wrap: nowrap;
}
.elev-head .seg label {
  padding: 5px 10px;
}
.d-ground {
  stroke: var(--axis);
  stroke-width: 1.5;
}
.d-object {
  stroke: var(--text-primary);
  stroke-width: 3;
  stroke-linecap: round;
}
.d-shadow {
  stroke: var(--text-secondary);
  stroke-width: 5;
  stroke-linecap: round;
  opacity: 0.5;
}
.d-ray {
  stroke: #fab219;
  stroke-width: 1.5;
  stroke-dasharray: 3 3;
}
.d-angle {
  stroke: var(--text-secondary);
  fill: none;
  stroke-width: 1.2;
}
.d-text {
  fill: var(--text-secondary);
  font-size: 10px;
  font-style: italic;
}
.d-text.small {
  font-size: 8px;
}
.az-grid {
  display: flex;
  gap: 12px;
  align-items: center;
}
.az-grid > .stack {
  flex: 1;
  min-width: 0;
}
.compass {
  width: 76px;
  height: 76px;
}
.c-ring {
  fill: var(--chart-surface);
  stroke: var(--axis);
}
.c-label {
  fill: var(--text-muted);
  font-size: 7px;
  text-anchor: middle;
}
.c-shadow {
  stroke: var(--text-secondary);
  stroke-width: 4;
  stroke-linecap: round;
  opacity: 0.6;
}
.c-sun {
  fill: #fab219;
  stroke: var(--chart-surface);
  stroke-width: 1.5;
}
.c-base {
  fill: var(--text-primary);
}
.add-shot {
  border-style: dashed;
  width: 100%;
}
.map-host .map {
  height: 240px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  z-index: 0;
}
.map-host .map.tall {
  height: min(60vh, 460px);
}
.map-consent {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  background: var(--surface-2);
}
.map-consent p {
  margin: 0;
  font-size: 13.5px;
}
.site-marker {
  fill: var(--accent);
  fill-opacity: 1;
  stroke: #fff;
  stroke-width: 2;
}
.site-radius {
  stroke: var(--accent);
  fill: var(--accent);
  fill-opacity: 0.12;
  stroke-width: 1.5;
}
.region-pin {
  fill: #fff;
  stroke: var(--text-primary);
  stroke-width: 2;
  fill-opacity: 1;
}
.btn.primary {
  background: var(--accent-fill);
  border-color: var(--accent-fill);
  color: var(--on-fill);
}
.btn.primary:hover:not(:disabled) {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}
.switch.compact {
  font-size: 13px;
  color: var(--text-secondary);
  margin-right: 6px;
  white-space: nowrap;
}
.field-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}
.stack.tight {
  gap: 6px;
}
.pair {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: 8px;
  align-items: start;
}
.chip-btn {
  border: 1px solid var(--border-strong);
  background: transparent;
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
}
.chip-btn.on {
  background: var(--accent-wash);
  border-color: var(--accent);
  color: var(--text-primary);
  font-weight: 600;
}
details.more > summary {
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--accent-text);
  padding: 4px 0;
}
details.more[open] > summary {
  margin-bottom: 8px;
}
.add-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}
.add-row .btn {
  justify-content: flex-start;
  text-align: left;
  padding: 10px 12px;
}
.add-row .btn span {
  display: flex;
  flex-direction: column;
}
.add-row small {
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 12px;
}
.stepper {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gstep {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.gstep.is-current {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), var(--shadow);
}
.gstep.is-todo .gstep-title {
  color: var(--text-secondary);
}
.gstep-h {
  margin: 0;
  font: inherit;
}
.gstep-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  background: none;
  cursor: pointer;
  text-align: left;
  border-radius: var(--radius);
}
.gstep-head:hover .gstep-edit {
  text-decoration: underline;
}
.gstep-mark {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 700;
  border: 2px solid var(--border-strong);
  color: var(--text-secondary);
}
.gstep-mark.is-current {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}
.gstep-mark.is-done {
  border-color: var(--good);
  background: var(--good);
  color: #fff;
}
.gstep-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.gstep-title {
  font-weight: 600;
  font-size: 15px;
}
.gstep-title .opt {
  margin-left: 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 0 7px;
  vertical-align: 2px;
}
.gstep-summary {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.gstep-edit {
  font-size: 13px;
  color: var(--accent-text);
  flex: none;
}
.gstep-body {
  padding: 0 14px 4px 52px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.gstep-body .shot {
  border-left-width: 4px;
}
.gstep-actions {
  display: flex;
  justify-content: flex-end;
  padding: 10px 14px 14px;
}
@media (max-width: 520px) {
  .gstep-body {
    padding-left: 14px;
  }
}
.landing {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}
.landing h2 {
  font-size: 19px;
}
.landing-choices {
  display: grid;
  gap: 10px;
}
.choice {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 14px;
  row-gap: 2px;
  align-items: center;
  text-align: left;
  padding: 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--chart-surface);
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.choice:hover,
.choice:focus-visible {
  border-color: var(--accent);
  background: var(--accent-wash);
}
.choice-icon {
  grid-row: span 2;
  color: var(--accent);
}
.choice strong {
  font-size: 16px;
}
.choice span:last-child {
  color: var(--text-secondary);
  font-size: 13.5px;
}
.eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-strong);
}
.claim-card > summary,
.evidence > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.claim-card > summary::-webkit-details-marker,
.evidence > summary::-webkit-details-marker {
  display: none;
}
.claim-card > summary > span,
.evidence > summary > span {
  display: flex;
  flex-direction: column;
}
.claim-card > summary small,
.evidence > summary small {
  color: var(--text-secondary);
  font-size: 12.5px;
}
.claim-card > summary::before,
.evidence > summary::before {
  content: "";
  width: 7px;
  height: 7px;
  margin-right: 12px;
  border-right: 2px solid var(--text-muted);
  border-bottom: 2px solid var(--text-muted);
  transform: rotate(-45deg);
  transition: transform 0.15s;
  flex: none;
}
.claim-card[open] > summary::before,
.evidence[open] > summary::before {
  transform: rotate(45deg);
}
.evidence > summary {
  padding: 12px 16px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
}
.evidence[open] > summary {
  margin-bottom: 16px;
}
.shot-flat {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.shot-flat > .preview {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.map-consent {
  flex-direction: row;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  background: none;
}

/* src/features/mode-tabs/mode-tabs.css */
.mode-tabs {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  max-width: 100%;
}
.mode-tab {
  min-height: 36px;
  padding: 7px 18px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.mode-tab:hover {
  color: var(--text-primary);
}
.mode-tab[aria-selected=true] {
  background: var(--accent-fill);
  color: var(--on-fill);
}
.mode-tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
@media (forced-colors: active) {
  .mode-tab[aria-selected=true] {
    outline: 2px solid Highlight;
    outline-offset: -2px;
  }
}
@media (max-width: 640px), (pointer: coarse) {
  .mode-tabs {
    width: 100%;
  }
  .mode-tab {
    flex: 1;
    min-height: 44px;
    padding: 7px 8px;
  }
}

/* src/features/results/results.css */
.summary .headline {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.headline.bad {
  color: var(--bad);
}
.meta {
  margin: 0;
  font-size: 12.5px;
  color: var(--text-muted);
}
.answers {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.answer {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--chart-surface);
  cursor: pointer;
  font-size: 15px;
}
.answer:hover {
  border-color: var(--accent);
}
.answer-main {
  flex: 1;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.answer-prob {
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.num-badge {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 99px;
  border: 2px solid var(--text-primary);
  font-size: 11px;
  font-weight: 700;
  flex: none;

.notes > summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  list-style: none;
}
.notes ul {

  padding: 0;

  display: flex;
  flex-direction: column;
  gap: 6px;

.notes li {
  display: flex;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);

.notes li svg {

  margin-top: 2px;
}
.empty h3 {
  font-size: 17px;
}
.steps {
  margin: 0;
  padding-left: 20px;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.todo {
  margin: 0;
  padding-left: 18px;
}
.heatmap-wrap {
  position: relative;
  width: 100%;
}
.heatmap {
  display: block;
  width: 100%;
  cursor: crosshair;
  touch-action: pan-y;
}
.tooltip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  max-width: 240px;
  padding: 6px 9px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.legend li {
  display: flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 14px;
  height: 10px;
  border-radius: 2px;
  flex: none;
}
.swatch.heat-1 {
  background: var(--heat-1);
}
.swatch.heat-2 {
  background: var(--heat-2);
}
.swatch.heat-3 {
  background: var(--heat-3);
}
.swatch.heat-tail {
  background: var(--heat-tail);
  opacity: 0.45;
}
.swatch.heat-ex {
  background:
    repeating-linear-gradient(
      45deg,
      var(--heat-excluded) 0 2px,
      transparent 2px 5px);
  opacity: 0.6;
}
.swatch.line {
  height: 2px;
  background: var(--text-secondary);
}
.cluster {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-top: 6px;
}
.cluster.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.cluster > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
  list-style: none;
  flex-wrap: wrap;
}
.cluster > summary::-webkit-details-marker {
  display: none;
}
.cl-dates {
  font-weight: 600;
}
.cl-tod {
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}
.cl-prob {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  min-width: 110px;
  justify-content: flex-end;
}
.prob-bar {
  display: inline-block;
  height: 6px;
  max-width: 60px;
  border-radius: 0 3px 3px 0;
  background: var(--heat-2);
}
.tag {
  font-size: 11px;
  padding: 0 6px;
  border-radius: 99px;
  border: 1px solid var(--warn);
  color: var(--warn);
}
.tag.neutral {
  border-color: var(--border-strong);
  color: var(--text-secondary);
}
.cluster-body {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.year > summary {
  cursor: pointer;
  padding: 6px 0;
  list-style: none;
}
.table-scroll {
  scroll-padding-top: 40px;
  overflow-x: auto;
  max-height: 360px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
table.windows {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
table.windows th,
table.windows td {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}
table.windows thead th {
  position: sticky;
  top: 0;
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 12px;
}
tr.clickable {
  cursor: pointer;
}
tr.clickable:hover,
tr.clickable:focus-visible,
tr.selected {
  background: var(--accent-wash);
}
.row-actions {
  display: flex;
  gap: 4px;
}
.sky svg.sunpath {

    }

    focus(id) {

    }
    render(res, req) {
      this.last = res;
      const top = res.regions.slice(0, 3);
      replace(
        this.summary,
        res.regions.length ? h("p", { class: "eyebrow" }, t("res.answer")) : null,
        res.regions.length ? h("p", { class: "headline" }, t(res.regions.length === 1 ? "place.oneArea" : "place.areas", { n: res.regions.length })) : h("p", { class: "headline bad" }, t("place.none")),
        top.length ? h("ol", { class: "answers" }, top.map(

            { type: "button", class: "answer", onclick: () => this.focus(r2.id) },
            h("span", { class: "num-badge" }, String(r2.id + 1)),
            h("span", { class: "answer-main" }, t("place.around", { pos: fmtLatLon(r2.bestLat, r2.bestLon, 3), area: fmtArea(r2.areaKm2) }))

        h("p", { class: "meta" }, t(req.shots.length > 1 ? "place.metaShadows" : "place.metaShadow", { n: req.shots.length, grid: res.resolutionDeg.toFixed(2) })),
        res.warnings.length ? h("details", { class: "notes", open: !res.regions.length }, h("summary", null, t("res.notes", { n: res.warnings.length })), h("ul", null, res.warnings.map((w) => h("li", null, icon("warn", 16), h("span", null, tm(w)))))) : null

            "table",
            { class: "windows" },
            h("thead", null, h("tr", null, ["#", t("place.colCentre"), t("place.colExtent"), t("place.colArea"), ""].map((label) => h("th", { scope: "col" }, label)))),
            h("tbody", null, res.regions.slice(0, 50).map(
              (r2) => h(
                "tr",
                { class: "clickable", dataset: { region: String(r2.id) }, tabindex: 0, onclick: () => this.focus(r2.id), onkeydown: (e) => e.key === "Enter" && this.focus(r2.id) },
                h("td", null, h("span", { class: "num-badge" }, String(r2.id + 1))),

                  } }, icon("copy", 14), t("res.copy")),
                  h("a", { class: "btn ghost small", href: `https://www.openstreetmap.org/?mlat=${r2.bestLat.toFixed(5)}&mlon=${r2.bestLon.toFixed(5)}#map=12/${r2.bestLat.toFixed(5)}/${r2.bestLon.toFixed(5)}`, target: "_blank", rel: "noopener noreferrer", onclick: (e) => e.stopPropagation() }, icon("pin", 14), t("place.openOsm"), h("span", { class: "sr-only" }, ` ${t("newTab")}`))
                )

      renderBudget(this.budget, res.observations, req.shots.map((s) => s.label));
    }
  };

  // src/features/results/results.ts
  function mountResults(host, deps) {
    const { cases: cases2, view: view2, session: session2 } = deps;
    const announcer = h("div", { id: "announce", class: "sr-only", "aria-live": "polite", "aria-atomic": "true" });
    const progress = h("progress", { max: 1, value: 0, hidden: true });
    const statusText = h("span");
    const body = h("div", { id: "results-body" });
    host.replaceChildren(
      h("h2", { id: "results-h", class: "sr-only" }, t("app.results")),
      announcer,
      h("div", { class: "job-status" }, progress, statusText),
      body
    );
    const timeView = new TimeResultsView(deps.claimCard);
    const placeView = new PlaceResultsView();
    const syncEvidence = () => {
      timeView.evidence.open = view2.expert;
      placeView.evidence.open = view2.expert;
    };
    syncEvidence();
    view2.subscribe(() => {
      syncEvidence();
      if (session2.status.kind === "invalid") show(session2.status);
    });
    let announceTimer = 0;
    const announce = (text) => {
      clearTimeout(announceTimer);
      announceTimer = window.setTimeout(() => announcer.textContent = text, 800);
    };
    const setJobStatus = (text, fraction = null) => {
      statusText.textContent = text;
      progress.hidden = fraction === null;
      if (fraction !== null) progress.value = fraction;
    };
    const emptyState = (errors) => {
      const s = cases2.state;
      if (!view2.expert && !view2.started) return null;
      return h(
        "section",
        { class: "card result empty" },
        untouched(s) ? [
          h("h3", null, t(s.mode === "time" ? "landing.when" : "landing.where")),
          h(
            "ol",
            { class: "steps" },
            (s.mode === "time" ? ["empty.time1", "empty.time2", "empty.time3"] : ["empty.place1", "empty.place2"]).map((k) => h("li", null, t(k)))
          ),
          h("p", { class: "hint" }, t("empty.examples")),
          deps.exampleButtons()
        ] : [
          h("h3", null, t("empty.needed")),
          h(
            "ul",
            { class: "todo" },
            [...new Map(errors.map((e) => [tm(e.msg), e])).entries()].slice(0, 8).map(([text, e]) => h("li", null, h("button", { type: "button", class: "link", onclick: () => deps.focusField(e.key) }, text)))
          )
        ]
      );
    };
    const rerender = () => {
      const solved = session2.solved;
      if (!solved) return;
      if (solved.mode === "time") timeView.render(solved.res, solved.req);
      else placeView.render(solved.res, solved.req);
    };
    onThemeChange(rerender);
    function show(st) {
      switch (st.kind) {
        case "invalid": {
          setJobStatus("");
          body.classList.remove("stale");
          const empty = emptyState(st.errors);
          body.replaceChildren(...empty ? [empty] : []);
          return;
        }
        case "running": {
          const current2 = cases2.state.mode === "time" ? timeView.el : placeView.el;
          if (body.firstChild !== current2) body.classList.add("stale");
          setJobStatus(st.phase ? tm(st.phase) : t("progress.computing"), st.fraction);
          return;
        }
        case "error":
          body.classList.remove("stale");
          setJobStatus("");
          body.replaceChildren(h("section", { class: "card result empty" }, h("h3", null, t("empty.cannot")), h("p", null, tm(st.error))));
          return;
        case "done": {
          body.classList.remove("stale");
          setJobStatus("");
          const s = st.solved;
          if (s.mode === "time") {
            if (body.firstChild !== timeView.el) body.replaceChildren(timeView.el);
            timeView.render(s.res, s.req);
            const n = s.res.clusters.filter((c) => c.year === s.req.constraints.yearFrom).length;
            announce(n ? t(n > 1 ? "announce.periods" : "announce.period", { n }) : t("announce.noTime"));
          } else {
            if (body.firstChild !== placeView.el) body.replaceChildren(placeView.el);
            placeView.render(s.res, s.req);
            const n = s.res.regions.length;
            announce(n ? t(n > 1 ? "announce.areas" : "announce.area", { n }) : t("announce.noPlace"));
          }
        }
      }
    }
    session2.subscribe(show);
  }

  // src/features/share-export/report.ts
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function stamp(d = /* @__PURE__ */ new Date()) {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}-${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}Z`;
  }
  async function exportReport(state, solved) {
    const inputs2 = JSON.stringify(state);
    const results = solved?.mode === "time" ? {
      // WHY drop `probability`: with declared bounds it is only a duration share, and a
      // forensic report must not present it as a probability.
      clusters: solved.res.clusters.map(({ probability: _p, ...c }) => c),
      warnings: solved.res.warnings,
      observations: solved.res.observations
    } : solved?.mode === "place" ? { regions: solved.res.regions.map(({ probability: _p, ...r2 }) => r2), resolutionDeg: solved.res.resolutionDeg, cellCount: solved.res.cells.length, cells: solved.res.cells, warnings: solved.res.warnings, observations: solved.res.observations } : null;
    const site = platform().site;
    const report = {
      application: { name: site.title, version: site.version, buildDate: site.date, edition: site.mode === "single" ? "offline copy" : "site", url: location.origin + location.pathname },
      generatedAtUtc: (/* @__PURE__ */ new Date()).toISOString(),
      mode: state.mode,
      method: {
        solarPosition: "NREL SPA (Reda & Andreas 2004), stated accuracy ±0.0003°; hourly-interpolated geocentric terms (error < 1e-5°)",
        deltaT: "Espenak & Meeus (2006) polynomials unless overridden",
        refraction: "SPA refraction for apparent elevation; Bennett (1982) for the measurement correction, bounded at ± " + 2 * REFRACTION_REL_SIGMA * 100 + " %",
        sunSemiDiameterDeg: SUN_SEMI_DIAMETER_DEG,
        uncertaintyModel: "Operator-declared tolerances treated as hard bounds; physical terms and place/time tolerances propagated as bounds; a time or place is reported when it lies inside every bound",
        coarseStepS: COARSE_STEP_S,
        fineStepS: FINE_STEP_S
      },
      inputsSha256: await sha256(inputs2),
      inputs: state,
      request: solved?.req ?? null,
      results
    };
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${stamp()}.shadowclock.report.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5e3);
  }
  async function printReport(state) {
    const header = document.getElementById("print-header");
    const site = platform().site;
    if (header) {
      header.textContent = t("report.printHeader", {
        app: site.title,
        version: site.version,
        time: (/* @__PURE__ */ new Date()).toISOString(),
        sha: await sha256(JSON.stringify(state))
      });
    }
    const closed = [...document.querySelectorAll("details:not([open])")];
    closed.forEach((d) => d.open = true);
    window.print();
    closed.forEach((d) => d.open = false);
  }

  // src/features/share-export/menu.ts
  function shareItems(s) {
    const v = (x) => x.trim() || t("share.item.none");
    const items = [{ label: t("share.item.mode"), value: t(s.mode === "time" ? "app.findTime" : "app.findPlace") }];
    if (s.mode === "time") items.push({ label: t("share.item.place"), value: `${v(s.site.loc)} ± ${s.site.radius} ${s.site.radiusUnit}` });
    for (const sh of s.shots) {
      const values = Object.values(sh.f).filter((x) => x.trim()).join(", ");
      const when = s.mode === "place" ? sh.time : sh.offset;
      items.push({ label: t("share.item.shadow", { label: sh.label }), value: [values, sh.az, when].filter((x) => x.trim()).join(" · ") || t("share.item.none") });
    }
    if (s.mode === "time") {
      const c = s.cons;
      items.push({ label: t("share.item.constraints"), value: [`${c.yearFrom}–${c.yearTo}`, c.todFrom && `${c.todFrom}–${c.todTo}`, c.zoneValue].filter(Boolean).join(" · ") });
      if (s.claim.time.trim()) items.push({ label: t("share.item.claim"), value: `${s.claim.time} ${s.claim.offset}`.trim() });
    } else if (s.search.kind === "bbox") {
      items.push({ label: t("share.item.area"), value: v(s.search.bbox) });
    }
    return items;
  }
  function mountShareMenu(slot, deps) {
    const { cases: cases2, session: session2 } = deps;
    const menu = h("details", { class: "menu", id: "share-menu" });
    const close = () => menu.open = false;
    const summary = h("summary", { class: "btn ghost icon-only", id: "share-summary", "aria-label": t("share.menu"), title: t("share.menu") }, icon("share"));
    const item = (id, title, sub, onclick, warn = false) => h("button", { type: "button", role: "menuitem", id, onclick }, h("strong", null, title), sub ? h("small", { class: warn ? "warn-text" : "" }, sub) : null);
    const copyToolLink = async () => {
      close();
      const site = platform().site;
      const url = site.mode === "single" && site.siteUrl ? site.siteUrl : `${location.origin}${location.pathname}`;
      try {
        await navigator.clipboard.writeText(url);

    menu.append(
      summary,
      h(
        "div",
        { class: "menu-list right", role: "menu", id: "share-list" },
        item("share-tool", t("share.tool"), t("share.toolSub"), () => void copyToolLink()),
        item("share-calc", t("share.calc"), t("share.calcSub"), () => {

          void platform().share.offer(cases2.state, shareItems(cases2.state)).then((copied) => copied && toast(t("share.calcDone")));
        }, true),
        h("hr"),

  // src/features/toolbar/toolbar.ts
  function closeMenus(except) {
    document.querySelectorAll("details.menu[open]").forEach((d) => {
      if (!except || !d.contains(except)) d.open = false;
    });
  }
  function mountToolbar(header, button, toolbar) {
    button.append(icon("menu"));
    button.setAttribute("aria-label", t("app.menu"));
    button.setAttribute("aria-controls", toolbar.id);
    button.setAttribute("aria-expanded", "false");
    button.addEventListener("click", () => {
      const open = !header.classList.contains("menu-open");
      header.classList.toggle("menu-open", open);
      button.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (e) => closeMenus(e.target));
    document.addEventListener("focusin", (e) => closeMenus(e.target));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMenus();
    });
  }

  // src/main.ts
  var platform2 = startPlatform({ strings: STRINGS });
  setPlatform(platform2);
  var shotLabel = (n) => t("shot.default", { n });
  var shared = platform2.share.incoming !== null ? parseCase(platform2.share.incoming, shotLabel) : null;
  var cases = new CaseStore(shared ?? loadCase(platform2, shotLabel) ?? defaultState(shotLabel(1)));
  var view = new ViewState(platform2, !untouched(cases.state));
  var session = new SolveSession(cases, new JobRunner(() => platform2.worker("solver")));
  cases.subscribe((s) => {
    session.schedule();
    saveCaseSoon(platform2, s);
  });
  byId("app-title").textContent = platform2.site.title;
  byId("tagline").textContent = t("app.tagline");

  mountModeTabs(byId("mode-slot"), byId("workspace"), cases, view);
  mountExpertToggle(byId("expert-slot"), view);
  mountExamplesMenu(byId("examples-slot"), loadExample);
  mountShareMenu(byId("share-slot"), {

  inputs.render();
  session.solve();
})();
